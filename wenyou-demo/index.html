<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>文优小助 Demo · 文献综述文献需求联动</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f8fc}
    iframe{border:0;width:100%;height:100%;display:block}
  </style>
</head>
<body>
<iframe id="wenyouFrame" src="../wenyouxiaozhu-prototype.html" title="文优小助产品重构 Demo"></iframe>
<script>
const frame=document.getElementById('wenyouFrame');

frame.addEventListener('load',()=>{
  const d=frame.contentDocument;
  if(!d || d.getElementById('wy-review-req-patch')) return;

  const style=d.createElement('style');
  style.id='wy-review-req-patch';
  style.textContent=`
    .wy-req-shell{display:grid;gap:11px}
    .wy-req-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
    .wy-req-total{display:flex;align-items:center;gap:7px;font-size:11px}
    .wy-req-total input{width:78px;height:34px;border:1px solid var(--line);border-radius:7px;padding:0 8px;font-size:12px}
    .wy-system-rec{display:inline-flex;align-items:center;gap:5px;padding:6px 8px;border-radius:7px;background:var(--purple-weak);color:var(--purple);font-size:10px}
    .wy-discipline{display:flex;align-items:center;gap:7px;font-size:11px}
    .wy-discipline select{height:34px;border:1px solid var(--line);border-radius:7px;background:#fff;padding:0 9px;font-size:11px;min-width:180px}
    .wy-expand{height:32px;padding:0 10px;border:1px solid var(--line);border-radius:7px;background:#fff;color:#525b70;font-size:10px}
    .wy-req-detail{display:none;padding:11px;border:1px solid #ded8f8;border-radius:8px;background:#fbfaff}
    .wy-req-detail.open{display:grid;gap:8px}
    .wy-req-tip{color:var(--muted);font-size:10px;line-height:1.55}
    .wy-req-row{display:grid;grid-template-columns:minmax(150px,1fr) 92px 118px 88px;gap:8px;align-items:center;padding:9px;border:1px solid var(--line);border-radius:7px;background:#fff}
    .wy-req-name strong{display:block;font-size:11px}.wy-req-name small{display:block;margin-top:2px;color:var(--muted);font-size:9px}
    .wy-req-row input{width:100%;height:30px;border:1px solid var(--line);border-radius:6px;padding:0 7px;font-size:11px}
    .wy-kind{display:flex;padding:2px;border-radius:6px;background:#f0f2f6}
    .wy-kind button{flex:1;border:0;background:transparent;border-radius:5px;padding:5px 4px;color:#788093;font-size:9px}
    .wy-kind button.active{background:#fff;color:var(--purple);font-weight:700;box-shadow:0 1px 2px rgba(40,42,60,.08)}
    .wy-match{text-align:right;font-size:10px;color:var(--muted)}.wy-match.good{color:var(--teal)}.wy-match.warn{color:var(--amber)}
    .wy-library-check{border:1px solid #dcd6f5;border-radius:9px;background:#fcfbff;padding:12px}
    .wy-check-head{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:11px}
    .wy-spinner{width:13px;height:13px;border:2px solid #ddd7f4;border-top-color:var(--purple);border-radius:50%;display:none;animation:wyspin .7s linear infinite}
    .wy-library-check.checking .wy-spinner{display:inline-block}@keyframes wyspin{to{transform:rotate(360deg)}}
    .wy-check-title{display:flex;align-items:center;gap:7px;font-weight:700}
    .wy-progress{height:6px;border-radius:999px;background:#eceef4;overflow:hidden;margin:9px 0}
    .wy-progress i{display:block;height:100%;background:var(--purple);border-radius:999px;transition:.25s}
    .wy-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
    .wy-metric{padding:8px;border:1px solid var(--line);border-radius:7px;background:#fff}
    .wy-metric b{display:block;color:var(--purple);font-size:16px}.wy-metric span{font-size:9px;color:var(--muted)}
    .wy-gap{margin-top:9px;padding:9px 10px;border-radius:7px;background:var(--amber-weak);color:#77511b;font-size:10px;line-height:1.55}
    .wy-gap.good{background:var(--teal-weak);color:#246a63}
    .wy-upload{display:grid;gap:8px;padding:11px;border:1px dashed #b9afea;border-radius:7px;background:#fbfaff}
    .wy-upload-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
    .wy-upload strong{font-size:11px;color:var(--purple)}.wy-upload small{font-size:9px;color:var(--muted);line-height:1.5}
    .wy-upload-actions{display:flex;gap:7px;flex-wrap:wrap}
    .wy-upload input[type=file]{display:none}
    .wy-upload-status{font-size:10px;color:var(--muted)}
    .wy-create-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:15px;padding-top:14px;border-top:1px solid var(--line)}
    .wy-create-footer .hint{max-width:58%;font-size:10px;color:var(--muted);line-height:1.55}
    .wy-create-footer .actions{display:flex;gap:7px}
    .wy-demo-btn{height:30px;padding:0 9px;border:1px dashed #bcb3e7;border-radius:7px;background:#fff;color:#6d5ab0;font-size:9px}
    @media(max-width:900px){.wy-req-row{grid-template-columns:1fr 85px 110px}.wy-match{grid-column:1/-1;text-align:left}.wy-metrics{grid-template-columns:repeat(2,1fr)}.wy-create-footer{align-items:flex-start;flex-direction:column}.wy-create-footer .hint{max-width:none}}
  `;
  d.head.appendChild(style);

  const patch=d.createElement('script');
  patch.textContent=String.raw`
    (function(){
      const WY_DISCIPLINES={
        econ:{
          label:'经济 / 管理 / 社会科学',
          reqs:[
            {id:'ssci',name:'SSCI',desc:'社会科学引文索引',need:5,base:1,kind:'must'},
            {id:'cssci',name:'CSSCI',desc:'中文社会科学引文索引',need:5,base:2,kind:'must'},
            {id:'jcr12',name:'JCR Q1–Q2',desc:'JCR 高分区期刊',need:3,base:1,kind:'prefer'},
            {id:'recent',name:'近 5 年',desc:'保证研究时效性',need:12,base:3,kind:'prefer'}
          ]
        },
        cs:{
          label:'计算机 / AI / 信息科学',
          reqs:[
            {id:'ccf',name:'CCF A/B',desc:'计算机高质量会议 / 期刊',need:4,base:1,kind:'must'},
            {id:'scie',name:'SCIE',desc:'Science Citation Index Expanded',need:8,base:2,kind:'must'},
            {id:'jcr12',name:'JCR Q1–Q2',desc:'JCR 高分区期刊',need:4,base:1,kind:'prefer'},
            {id:'recent',name:'近 5 年',desc:'快速变化领域优先近期研究',need:14,base:3,kind:'prefer'}
          ]
        },
        stem:{
          label:'理工 / 材料 / 环境',
          reqs:[
            {id:'scie',name:'SCIE',desc:'自然科学与工程主流收录',need:10,base:2,kind:'must'},
            {id:'cas12',name:'中科院 1–2 区',desc:'按中科院期刊分区',need:5,base:1,kind:'prefer'},
            {id:'ei',name:'EI Compendex',desc:'工程技术重要文献来源',need:5,base:1,kind:'prefer'},
            {id:'recent',name:'近 5 年',desc:'保证研究时效性',need:12,base:3,kind:'prefer'}
          ]
        },
        med:{
          label:'医学 / 生命科学',
          reqs:[
            {id:'scie',name:'SCIE',desc:'医学 / 生命科学主流收录',need:10,base:2,kind:'must'},
            {id:'jcr12',name:'JCR Q1–Q2',desc:'优先较高质量期刊',need:6,base:1,kind:'prefer'},
            {id:'rct',name:'RCT / 系统综述',desc:'高证据等级研究类型',need:5,base:1,kind:'prefer'},
            {id:'recent',name:'近 5 年',desc:'优先近期临床证据',need:12,base:3,kind:'prefer'}
          ]
        },
        human:{
          label:'人文 / 法学 / 文史哲',
          reqs:[
            {id:'ahci',name:'A&HCI',desc:'艺术与人文引文索引',need:3,base:0,kind:'prefer'},
            {id:'cssci',name:'CSSCI',desc:'中文社会科学引文索引',need:8,base:2,kind:'must'},
            {id:'pkucore',name:'北大核心',desc:'中文核心期刊来源',need:8,base:2,kind:'prefer'},
            {id:'recent',name:'近 8 年',desc:'兼顾经典与近期研究',need:10,base:3,kind:'prefer'}
          ]
        }
      };

      function wyInitState(){
        state.wyReview=state.wyReview||{
          total:20,
          discipline:'econ',
          uploaded:0,
          duplicate:0,
          expanded:false,
          reqs:JSON.parse(JSON.stringify(WY_DISCIPLINES.econ.reqs))
        };
        return state.wyReview;
      }
      function wyHave(req){
        const s=wyInitState(),u=s.uploaded;
        if(req.id==='recent') return Math.min(s.total,req.base+Math.round(u*.8));
        if(req.id==='ssci'||req.id==='scie'||req.id==='cssci') return Math.min(s.total,req.base+Math.floor(u/2));
        if(req.id==='ccf'||req.id==='pkucore') return Math.min(s.total,req.base+Math.floor(u/3));
        if(req.id==='jcr12'||req.id==='cas12'||req.id==='rct'||req.id==='ei'||req.id==='ahci') return Math.min(s.total,req.base+Math.floor(u/4));
        return req.base;
      }
      function wyUsable(){return 3+wyInitState().uploaded}
      function wyHardMissing(){
        const s=wyInitState();
        return s.reqs.filter(r=>r.kind==='must'&&wyHave(r)<r.need);
      }
      function wySatisfied(){
        const s=wyInitState();
        return wyUsable()>=s.total&&wyHardMissing().length===0;
      }
      function wyGapText(){
        const s=wyInitState(),parts=[];
        const g=Math.max(0,s.total-wyUsable());
        if(g) parts.push('总量还缺 '+g+' 篇');
        wyHardMissing().forEach(r=>parts.push(r.name+' 至少还缺 '+(r.need-wyHave(r))+' 篇'));
        return parts.length?parts.join('；'):'已满足本次任务的必须要求';
      }
      function wyReqRows(){
        const s=wyInitState();
        return s.reqs.map((r,i)=>'<div class="wy-req-row"><div class="wy-req-name"><strong>'+r.name+'</strong><small>'+r.desc+'</small></div><input data-wy-need="'+i+'" type="number" min="0" max="'+s.total+'" value="'+r.need+'"><div class="wy-kind"><button type="button" class="'+(r.kind==='must'?'active':'')+'" data-wy-kind="'+i+'" data-kind="must">必须满足</button><button type="button" class="'+(r.kind==='prefer'?'active':'')+'" data-wy-kind="'+i+'" data-kind="prefer">优先满足</button></div><div class="wy-match '+(wyHave(r)>=r.need?'good':'warn')+'"><b>'+wyHave(r)+'</b> / ≥'+r.need+'</div></div>').join('');
      }
      function wyRequirementHTML(){
        const s=wyInitState(),ok=wySatisfied(),usable=wyUsable();
        return '<div class="wy-req-shell">'+
          '<div class="wy-req-head"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><div class="wy-req-total"><span>文献需求</span><input id="wyTotal" type="number" min="0" max="80" value="'+s.total+'"><span>篇</span></div><span class="wy-system-rec">系统建议 · 文献综述 '+s.total+' 篇</span><div class="wy-discipline"><span>学科</span><select id="wyDiscipline">'+Object.entries(WY_DISCIPLINES).map(([k,v])=>'<option value="'+k+'" '+(k===s.discipline?'selected':'')+'>'+v.label+'</option>').join('')+'</select></div></div><button class="wy-expand" id="wyExpand">'+(s.expanded?'收起详细要求 ▴':'展开详细要求 ▾')+'</button></div>'+
          '<div class="wy-req-detail '+(s.expanded?'open':'')+'" id="wyReqDetail"><div class="wy-req-tip">按学科提供质量评价项。同一篇论文可同时满足“收录体系 / 分区 / 年份”等多个非互斥条件；“必须满足”影响是否达标，“优先满足”只形成补充建议。</div>'+wyReqRows()+'</div>'+
          '<div class="wy-library-check" id="wyLibraryCheck"><div class="wy-check-head"><div class="wy-check-title"><i class="wy-spinner"></i><span id="wyCheckTitle">已连接你的文献库</span></div><span>'+usable+' / '+s.total+' 篇可用</span></div><div class="wy-progress"><i style="width:'+Math.min(100,s.total?usable/s.total*100:100)+'%"></i></div><div class="wy-metrics"><div class="wy-metric"><b>63</b><span>个人文献库</span></div><div class="wy-metric"><b>6</b><span>与当前选题相关</span></div><div class="wy-metric"><b>3</b><span>库内全文解析完成</span></div><div class="wy-metric"><b>'+usable+'</b><span>本次可用</span></div></div><div class="wy-gap '+(ok?'good':'')+'">'+(ok?'✓ 已满足本次任务文献要求，可进入生成。':'⚠ 当前建议补充：'+wyGapText()+'。')+'</div></div>'+
        '</div>';
      }
      function wyBind(){
        const s=wyInitState();
        const total=document.querySelector('#wyTotal');
        if(total){
          total.addEventListener('change',()=>{s.total=Math.max(0,Math.min(80,Number(total.value)||0));s.reqs.forEach(r=>r.need=Math.min(r.need,s.total));wyRecheck(true)});
          total.addEventListener('blur',()=>wyRecheck(true));
        }
        const dis=document.querySelector('#wyDiscipline');
        if(dis)dis.addEventListener('change',()=>{s.discipline=dis.value;s.reqs=JSON.parse(JSON.stringify(WY_DISCIPLINES[dis.value].reqs));wyRecheck(true)});
        const exp=document.querySelector('#wyExpand');
        if(exp)exp.addEventListener('click',()=>{s.expanded=!s.expanded;renderReviewCreate()});
        document.querySelectorAll('[data-wy-need]').forEach(inp=>inp.addEventListener('change',()=>{const r=s.reqs[Number(inp.dataset.wyNeed)];r.need=Math.max(0,Math.min(s.total,Number(inp.value)||0));wyRecheck(true)}));
        document.querySelectorAll('[data-wy-kind]').forEach(btn=>btn.addEventListener('click',()=>{s.reqs[Number(btn.dataset.wyKind)].kind=btn.dataset.kind;renderReviewCreate()}));
        const file=document.querySelector('#wyUpload');
        if(file)file.addEventListener('change',()=>{
          const count=file.files?file.files.length:0;
          const dup=count>=5?1:0;
          s.duplicate=dup;
          s.uploaded=Math.max(0,count-dup);
          renderReviewCreate();
          toast('已查重：'+s.uploaded+' 篇新增全文进入文献库'+(dup?'，'+dup+' 篇重复已忽略':''));
        });
      }
      function wyRecheck(showLoading){
        const card=document.querySelector('#wyLibraryCheck');
        if(showLoading&&card){
          card.classList.add('checking');
          const t=document.querySelector('#wyCheckTitle');if(t)t.textContent='正在按选题和质量要求匹配文献库…';
          setTimeout(()=>renderReviewCreate(),520);
        }else renderReviewCreate();
      }

      enhanceReviewCreate=function(){};

      renderReviewCreate=function(){
        const s=wyInitState(),usable=wyUsable(),ok=wySatisfied();
        document.querySelector('#workBody').innerHTML=
          pageTitle('创建文献综述','保留当前任务填写方式，在文献需求处实时联动个人文献库。','<button class="ghost" data-wy-review-back>返回开始任务</button>')+
          '<div class="create-review-layout"><section class="create-card"><h2>任务信息</h2><p>先补充本次综述的写作要求。文献需求为选填，系统会按任务类型给出默认建议。</p><div class="create-form">'+
          '<div class="create-form-row"><label>当前选题</label><div class="topic-chip"><strong>市场需求对中国省级旅游产业技术演化的影响</strong><span>已关联</span></div></div>'+
          '<div class="create-form-row"><label>* 标题</label><input id="reviewTopic" value="市场需求对中国省级旅游产业技术演化的影响"></div>'+
          '<div class="create-form-row"><label>研究方向</label><input id="wyDirection" value="旅游产业技术演化与区域市场需求" placeholder="请输入研究方向"></div>'+
          '<div class="create-form-row"><label>研究问题</label><textarea id="wyQuestion" placeholder="例如：市场需求如何影响省级旅游产业技术演化？">市场需求如何影响省级旅游产业技术演化？现有研究有哪些共同结论与不足？</textarea></div>'+
          '<div class="create-form-row"><label>* 字数</label><div class="word-row"><input id="wyWords" value="5000"><span class="muted">字</span></div></div>'+
          '<div class="create-form-row"><label>文献需求</label><div>'+wyRequirementHTML()+'</div></div>'+
          '<div class="create-form-row"><label>上传相关文献</label><div class="wy-upload"><div class="wy-upload-head"><div><strong>上传全文后自动查重并进入文献库</strong><br><small>只有“已入库 + 有全文 + 解析完成”的文献才计入本次可用数量。</small></div><div class="wy-upload-actions"><label class="small-btn primary" for="wyUpload">选择本地文件</label><input id="wyUpload" type="file" accept=".pdf,.ris,.bib" multiple><button class="wy-demo-btn" type="button" data-wy-sim-upload>原型：模拟加入 8 篇</button></div></div><div class="wy-upload-status">'+(s.uploaded?'本次新增 '+s.uploaded+' 篇全文'+(s.duplicate?' · 已忽略 '+s.duplicate+' 篇重复文献':''):'尚未上传本次任务文献')+'</div></div></div>'+
          '<div class="create-form-row"><label>可选成果</label><div class="asset-check"><label class="asset-check-row"><input type="checkbox"> 使用已有学术成果 <small>当前暂无可关联成果</small></label><button class="small-btn" data-view="artifacts">查看学术成果</button></div></div>'+
          '</div><div class="wy-create-footer"><div class="hint">'+(ok?'文献数量与必须质量条件均已满足，可以开始生成。':'当前材料未完全满足要求。主操作优先补文献，但仍允许使用现有材料继续。')+'</div><div class="actions">'+(ok?'':'<button class="ghost" data-wy-force-generate>仍使用现有 '+usable+' 篇生成</button>')+'<button class="primary" data-wy-review-primary>'+(ok?'开始生成':'找文献')+'</button></div></div></section>'+
          '<aside class="create-side"><section class="create-card"><h2>文献需求如何联动？</h2><p>系统不会把“文献需求”当作普通 Prompt，而是直接检查个人研究资产。</p><div class="prepare-list"><div class="prepare-step"><i>1</i><div><strong>按选题匹配文献库</strong><small>先从全局个人文献库找到当前任务相关论文</small></div></div><div class="prepare-step"><i>2</i><div><strong>只计算可用全文</strong><small>仅全文存在且解析完成的文献进入可用数量</small></div></div><div class="prepare-step"><i>3</i><div><strong>按学科检查质量要求</strong><small>经济社科、计算机、理工、医学、人文使用不同评价体系</small></div></div><div class="prepare-step"><i>4</i><div><strong>实时计算缺口</strong><small>上传文献后立即查重、入库并重新计算</small></div></div></div></section><div class="create-note">材料不足时进入「找文献」；满足要求或用户选择继续时进入「生成 Paper」。两个后续分支暂时沿用现有 Demo，下一轮再分别重构。</div></aside></div>';
        document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.view==='review'));
        wyBind();
      };

      document.addEventListener('change',e=>{
        if(e.target.matches('#wyDirection,#wyQuestion,#wyWords')) wyRecheck(true);
      });

      document.addEventListener('click',e=>{
        const b=e.target.closest('button');
        if(!b)return;
        if(b.matches('[data-wy-review-back]')){
          document.body.classList.remove('task-setup');
          state.view='home';
          renderAll();
        }
        if(b.matches('[data-wy-sim-upload]')){
          const s=wyInitState();
          s.uploaded+=8;
          renderReviewCreate();
          toast('原型模拟：新增 8 篇全文，已重新计算文献需求');
        }
        if(b.matches('[data-wy-review-primary]')){
          document.body.classList.remove('task-setup');
          if(wySatisfied()){
            state.analysisDone=true;
            state.outlineEdited=false;
            state.view='review';
            toast('材料满足要求，进入生成 Paper 分支');
            renderAll();
          }else{
            state.view='recommend';
            state.wyReviewGap=wyGapText();
            toast('当前材料不足，进入找文献分支');
            renderAll();
          }
        }
        if(b.matches('[data-wy-force-generate]')){
          document.body.classList.remove('task-setup');
          state.analysisDone=true;
          state.outlineEdited=false;
          state.view='review';
          toast('已确认使用现有材料，进入生成 Paper 分支');
          renderAll();
        }
      },true);
    })();
  `;
  d.body.appendChild(patch);
});
</script>

<script>
frame.addEventListener('load',()=>{
  const d=frame.contentDocument;
  if(!d || d.getElementById('wy-find-branch-patch')) return;

  const style=d.createElement('style');
  style.id='wy-find-branch-patch';
  style.textContent=`
    .wy-find-config{max-width:930px;margin:0 auto}
    .wy-find-config-grid{display:grid;grid-template-columns:minmax(0,1.18fr) minmax(280px,.82fr);gap:14px}
    .wy-find-card{background:#fff;border:1px solid var(--line);border-radius:9px;padding:16px}

      function wyPaperActions(p){

    }
  `;
  d.head.appendChild(style);

  const js=d.createElement('script');
  js.textContent=String.raw`
    (function(){
      function wy8State(){
        state.wy8=state.wy8||{
          messages:[],
          outline:[
            {level:1,text:'1 绪论'},
            {level:2,text:'1.1 研究背景与意义'},
            {level:2,text:'1.2 国内外研究现状'},
            {level:1,text:'2 理论基础与概念界定'},
            {level:2,text:'2.1 核心概念'},
            {level:2,text:'2.2 理论基础'},
            {level:1,text:'3 主要影响因素分析'},
            {level:2,text:'3.1 政策与制度环境'},
            {level:2,text:'3.2 市场需求'},
            {level:2,text:'3.3 技术创新'},
            {level:2,text:'3.4 区域基础条件'},
            {level:1,text:'4 研究不足与未来方向'},
            {level:1,text:'5 结论'}
          ]
        };
        return state.wy8;
      }

      function currentReviewTask(){
        return state.tasks?.find(t=>t.id==='review') || state.tasks?.find(t=>t.type==='文献综述');
      }
      function taskTitle(){
        return currentReviewTask()?.title || '低空经济发展的影响因素研究';
      }

      function sideHTML(){
        return '<aside class="wy8-side">'+
          '<div><div class="wy8-side-title">任务类别</div>'+
            '<button class="wy8-topic"><span>'+taskTitle()+'</span><span>⌃</span></button>'+
            '<div class="wy8-tree">'+
              '<button class="wy8-nav active" data-wy8-nav="review">文献综述</button>'+
              '<button class="wy8-nav" data-wy8-nav="proposal">开题报告</button>'+
              '<button class="wy8-nav" data-wy8-nav="draft">论文初稿</button>'+
            '</div>'+
          '</div>'+
          '<div class="wy8-divider"></div>'+
          '<div><div class="wy8-side-title">研究资产</div>'+
            '<button class="wy8-nav" data-wy8-nav="library">文献库</button>'+
            '<button class="wy8-nav" data-wy8-nav="artifacts">学术成果</button>'+
          '</div>'+
          '<div class="wy8-side-note">当前选题下的任务在这里聚类；文献库和学术成果作为研究资产持续复用。</div>'+
        '</aside>';
      }

      function assistantHTML(){
        const s=wy8State();
        const extra=s.messages.map(x=>
          '<div class="wy8-bubble wy8-user">'+x+'</div>'+
          '<div class="wy8-msg"><div class="wy8-avatar">AI</div><div class="wy8-bubble">已收到。我会据此调整右侧大纲，你也可以继续手动修改章节。</div></div>'
        ).join('');
        return '<section class="wy8-assistant">'+
          '<header class="wy8-assistant-head">'+
            '<div class="wy8-assistant-head-row"><h2>文优小助手 ✦</h2><span class="status-pill">等待确认</span></div>'+
            '<div class="wy8-task-chip">当前任务：'+taskTitle()+' · 文献综述</div>'+
          '</header>'+
          '<div class="wy8-assistant-body">'+
            '<div class="wy8-msg"><div class="wy8-avatar">AI</div><div class="wy8-bubble">我已经完成本次文献综述的材料准备，并根据你的研究问题和文献结构生成了研究大纲。你可以直接确认，也可以先调整章节结构。</div></div>'+
            '<div class="wy8-card">'+
              '<div class="wy8-card-title"><span>当前任务进度</span><span class="muted">正文尚未开始</span></div>'+
              '<div class="wy8-progress">'+
                '<div class="wy8-step done">匹配文献<br>完成</div>'+
                '<div class="wy8-step done">读取批注<br>完成</div>'+
                '<div class="wy8-step done">加载术语<br>完成</div>'+
                '<div class="wy8-step done">构建材料<br>完成</div>'+
                '<div class="wy8-step current">确认大纲<br>当前</div>'+
                '<div class="wy8-step">撰写正文<br>等待</div>'+
              '</div>'+
            '</div>'+
            '<div class="wy8-card">'+
              '<div class="wy8-card-title"><span>本次任务材料</span><span class="muted">材料透明化</span></div>'+
              '<div class="wy8-stats">'+
                '<div class="wy8-stat"><b>18</b><span>本次采用文献</span></div>'+
                '<div class="wy8-stat"><b>18</b><span>全文可用</span></div>'+
                '<div class="wy8-stat"><b>26</b><span>相关批注</span></div>'+
                '<div class="wy8-stat"><b>14</b><span>核心术语</span></div>'+
              '</div>'+
            '</div>'+
            extra+
            '<div class="wy8-actions">'+
              '<button class="small-btn primary" data-wy8-material>查看本次任务材料</button>'+
              '<button class="small-btn" data-wy8-prompt="政策机制部分再细一点">政策机制再细一点</button>'+
              '<button class="small-btn" data-wy8-prompt="减少背景部分，增加研究争议">强化研究争议</button>'+
            '</div>'+
          '</div>'+
          '<footer class="wy8-compose"><div class="wy8-compose-row">'+
            '<input id="wy8Input" placeholder="例如：把政策机制部分拆得更细一些">'+
            '<button data-wy8-send>➤</button>'+
          '</div></footer>'+
        '</section>';
      }

      function outlineRows(){
        const s=wy8State();
        return s.outline.map((x,i)=>
          '<div class="wy8-outline-row '+(x.level===2?'child':'')+'">'+
            '<div class="wy8-drag">⋮⋮</div>'+
            '<input class="wy8-outline-input" data-wy8-outline-input="'+i+'" value="'+x.text.replaceAll('"','&quot;')+'">'+
            '<button data-wy8-delete="'+i+'">删除</button>'+
          '</div>'
        ).join('');
      }

      function outlineHTML(){
        return '<section class="wy8-outline">'+
          '<header class="wy8-outline-head">'+
            '<div><h1>大纲方案</h1><p>基于 18 篇全文文献、26 条批注和 14 个核心术语生成，可直接轻量编辑。</p></div>'+
            '<div class="wy8-outline-head-actions"><span class="status-pill">等待确认</span><button class="small-btn" data-wy8-regenerate>重新生成大纲</button></div>'+
          '</header>'+
          '<div class="wy8-outline-scroll">'+
            '<div class="wy8-outline-list">'+outlineRows()+'</div>'+
            '<button class="wy8-add-row" data-wy8-add>＋ 添加章节</button>'+
          '</div>'+
          '<footer class="wy8-outline-foot">'+
            '<small>确认后将正式进入正文生成阶段，文优小助手会继续显示生成进度。</small>'+
            '<div class="actions"><button class="ghost" data-wy8-regenerate>重新生成大纲</button><button class="primary" data-wy8-confirm>确认大纲并生成正文</button></div>'+
          '</footer>'+
        '</section>';
      }

      function renderOutlineV8(){
        document.body.classList.add('wy-outline-v8','task-setup');
        const wb=document.querySelector('#workBody');
        if(!wb)return;
        wb.innerHTML='<div class="wy8-shell">'+sideHTML()+assistantHTML()+outlineHTML()+'</div>';
      }
      window.__renderOutlineV8=renderOutlineV8;

      /* 只替换“大纲待确认”这一状态，正文页仍沿用当前母版 */
      const oldRenderReview=renderReview;
      renderReview=function(){
        if(state.analysisDone && !state.outlineEdited){
          setTimeout(renderOutlineV8,0);
          return '<div></div>';
        }
        document.body.classList.remove('wy-outline-v8');
        return oldRenderReview();
      };

      /* 老用户已有任务卡可恢复 */
      document.addEventListener('click',e=>{
        const card=e.target.closest('.task-card[data-task]');
        if(!card)return;
        const id=card.dataset.task;
        const task=state.tasks?.find(t=>String(t.id)===String(id));
        if(!task)return;

        e.preventDefault();
        e.stopImmediatePropagation();

        if(task.type==='文献综述' || id==='review'){
          state.analysisDone=true;
          state.outlineEdited=false;
          state.view='review';
          renderAll();
          setTimeout(renderOutlineV8,0);
          toast('已恢复文献综述：进入大纲确认');
        }else if(task.type==='开题报告' || id==='proposal'){
          document.body.classList.remove('wy-outline-v8','task-setup');
          state.view='proposal';
          renderAll();
          toast('已恢复开题报告');
        }else if(task.type==='论文初稿' || id==='draft'){
          document.body.classList.remove('wy-outline-v8','task-setup');
          state.view='draft';
          renderAll();
          toast('已恢复论文初稿');
        }
      },true);

      document.addEventListener('input',e=>{
        const inp=e.target.closest('[data-wy8-outline-input]');
        if(!inp)return;
        const idx=Number(inp.dataset.wy8OutlineInput);
        if(wy8State().outline[idx]) wy8State().outline[idx].text=inp.value;
      });

      document.addEventListener('click',e=>{
        const b=e.target.closest('button');
        if(!b)return;

        if(b.matches('[data-wy8-nav]')){
          const v=b.dataset.wy8Nav;
          document.body.classList.remove('wy-outline-v8','task-setup');
          if(v==='review'){
            state.view='review';state.analysisDone=true;state.outlineEdited=false;
            renderAll();setTimeout(renderOutlineV8,0);
          }else{
            state.view=v;renderAll();
          }
        }

        if(b.matches('[data-wy8-delete]')){
          const i=Number(b.dataset.wy8Delete);
          wy8State().outline.splice(i,1);
          renderOutlineV8();
        }

        if(b.matches('[data-wy8-add]')){
          wy8State().outline.push({level:1,text:'新增章节'});
          renderOutlineV8();
        }

        if(b.matches('[data-wy8-material]')){
          toast('本次任务材料：18 篇全文文献 · 26 条批注 · 14 个核心术语');
        }

        if(b.matches('[data-wy8-prompt]')){
          wy8State().messages.push(b.dataset.wy8Prompt);
          if(b.dataset.wy8Prompt.includes('政策机制')){
            const index=wy8State().outline.findIndex(x=>x.text.includes('政策与制度环境'));
            if(index>=0){
              wy8State().outline.splice(index+1,0,
                {level:2,text:'3.1.1 国家政策驱动'},
                {level:2,text:'3.1.2 地方治理机制'},
                {level:2,text:'3.1.3 空域管理制度'}
              );
            }
          }
          renderOutlineV8();
        }

        if(b.matches('[data-wy8-send]')){
          const input=document.querySelector('#wy8Input');
          const txt=input?.value.trim();
          if(txt){
            wy8State().messages.push(txt);
            renderOutlineV8();
          }
        }

        if(b.matches('[data-wy8-regenerate]')){
          document.querySelector('#wy8ConfirmOverlay')?.remove();
          const overlay=document.createElement('div');
          overlay.id='wy8ConfirmOverlay';
          overlay.className='wy8-confirm-overlay';
          overlay.innerHTML='<div class="wy8-confirm-card"><h3>重新生成大纲？</h3><p>重新生成会覆盖你在当前大纲中的手动修改。</p><div class="actions"><button class="ghost" data-wy8-cancel-regenerate>取消</button><button class="primary" data-wy8-do-regenerate>确认重新生成</button></div></div>';
          document.body.appendChild(overlay);
        }

        if(b.matches('[data-wy8-cancel-regenerate]')){
          document.querySelector('#wy8ConfirmOverlay')?.remove();
        }

        if(b.matches('[data-wy8-do-regenerate]')){
          state.wy8=null;
          document.querySelector('#wy8ConfirmOverlay')?.remove();
          renderOutlineV8();
          toast('大纲已重新生成');
        }

        if(b.matches('[data-wy8-confirm]')){
          document.body.classList.remove('wy-outline-v8','task-setup');
          state.outlineEdited=true;
          state.view='review';
          renderAll();
          toast('大纲已确认，进入正文生成');
        }
      },true);

      document.addEventListener('keydown',e=>{
        if(e.key==='Enter' && e.target?.id==='wy8Input'){
          e.preventDefault();
          document.querySelector('[data-wy8-send]')?.click();
        }
      });
    })();
  `;
  d.body.appendChild(js);
});
</script>








<script>
frame.addEventListener('load',()=>{
  const d=frame.contentDocument;

    body.wy11-modern:not(.prelogin):not(.task-setup):not(.wy-outline-v8) .main{
      grid-template-columns:250px 380px minmax(520px,1fr)!important
    }
    body.wy11-modern .chat-head [data-clear]{display:none!important}

    /* ---------- Common latest left navigation ---------- */
    .wy11-side-inner{height:100%;display:flex;flex-direction:column;gap:18px}

    /* ---------- Review form: latest left nav + wide form, no old right explainer ---------- */
    body.wy11-review-form .project-switch,
    body.wy11-review-form .sidebar,
    body.wy11-review-form .chat,
    body.wy11-review-form .workspace>.tabs{display:none!important}
    body.wy11-review-form .main{display:block!important;height:calc(100vh - 64px)!important}
    body.wy11-review-form .workspace{display:block!important;height:100%!important;border:0!important}
    body.wy11-review-form .work-body{height:100%!important;padding:0!important;overflow:hidden!important;background:#f7f8fc!important}

    .wy11-form-shell{height:100%;display:grid;grid-template-columns:250px minmax(0,1fr)}
    .wy11-form-side{background:#fff;border-right:1px solid var(--line);padding:18px 14px;overflow:auto}
    .wy11-form-main{overflow:auto;padding:28px 34px 48px;min-width:0}
    .wy11-form-main .page-title{max-width:1080px;margin:0 auto 16px}
    .wy11-form-main .create-card{max-width:1080px;margin:0 auto;border-radius:10px;padding:20px 22px}
    .wy11-form-main .create-review-layout{display:block!important;max-width:none!important;margin:0!important}
    .wy11-form-main .create-side{display:none!important}
    .wy11-form-main .create-form-row{grid-template-columns:110px minmax(0,1fr)!important}
    .wy11-form-main .create-form-row>label{font-size:12px}
    .wy11-form-main .wy-create-footer{margin-top:20px}

    /* ---------- Old-user home: same shell, different work state ---------- */
    .wy11-old-home{max-width:980px;margin:0 auto;padding:3px 0 30px}
    .wy11-old-kicker{font-size:11px;font-weight:800;color:var(--purple);margin-bottom:7px}
    .wy11-old-home h1{margin:0;font-size:23px}
    .wy11-old-home>p{margin:7px 0 18px;color:var(--muted);font-size:11px;line-height:1.65}
    .wy11-old-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:13px}
    .wy11-old-card{border:1px solid var(--line);border-radius:9px;background:#fff;padding:16px}
    .wy11-old-card h2{margin:0 0 6px;font-size:15px}
    .wy11-old-card>p{margin:0 0 12px;color:var(--muted);font-size:10px;line-height:1.6}
    .wy11-resume-list{display:grid;gap:8px}
    .wy11-resume{
      width:100%;border:1px solid var(--line);border-radius:8px;background:#fcfdff;
      padding:11px;text-align:left;display:grid;gap:4px
    }
    .wy11-resume.primary-task{border-color:#baaaff;background:var(--purple-weak)}
    .wy11-resume b{font-size:11px}
    .wy11-resume em{font-size:9px;color:var(--teal);font-style:normal}
    .wy11-resume span{font-size:9px;color:var(--muted);line-height:1.45}
    .wy11-old-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
    .wy11-old-stat{padding:10px;border:1px solid var(--line);border-radius:8px;background:#fbfcff}

    @media(max-width:1200px){
      .wy11-form-shell{grid-template-columns:225px minmax(0,1fr)}
      .wy11-form-main{padding:24px}

    @media(max-width:1000px){
      .wy11-old-grid{grid-template-columns:1fr}

  `;
  d.head.appendChild(style);

  const js=d.createElement('script');
  js.textContent=String.raw`
    (function(){
      state.wy11UserMode=state.wy11UserMode||null;   // 'new' | 'old'
      state.wy11NewTask=state.wy11NewTask||null;     // review | proposal | draft | null

      function setUserMode(mode){
        state.wy11UserMode=mode;
        document.body.classList.add('wy11-modern');
      }

      function reviewTitle(){
        const formTitle=document.querySelector('#reviewTopic')?.value?.trim();
        if(formTitle)return formTitle;
        if(state.wy11UserMode==='old')return '低空经济发展的影响因素研究';
        return state.tasks?.find(t=>t.type==='文献综述')?.title || '市场需求对中国省级旅游产业技术演化的影响';
      }

      function activeNav(){
        if(['library','notes','terms','reading','recommend'].includes(state.view))return 'library';
        if(state.view==='artifacts')return 'artifacts';
        if(state.view==='proposal')return 'proposal';
        if(state.view==='draft')return 'draft';
        if(state.view==='oldHome')return 'review';
        return 'review';
      }

      function sideInner(activeOverride){
        const active=activeOverride||activeNav();
        const noTask=state.wy11UserMode==='new' && !state.wy11NewTask && ['recommend','library','notes','terms','reading','assets','artifacts'].includes(state.view);
        const topic=noTask?'尚未创建写作任务':reviewTitle();

        return '<div class="wy11-side-inner">'+
          '<div>'+
            '<div class="wy11-side-title">任务类别</div>'+
            '<button class="wy11-topic"><span>'+topic+'</span><span>⌃</span></button>'+
            '<div class="wy11-tree">'+
              '<button class="wy11-nav '+(active==='review'?'active':'')+'" data-wy11-nav="review">文献综述</button>'+
              '<button class="wy11-nav '+(active==='proposal'?'active':'')+'" data-wy11-nav="proposal">开题报告</button>'+
              '<button class="wy11-nav '+(active==='draft'?'active':'')+'" data-wy11-nav="draft">论文初稿</button>'+
            '</div>'+
          '</div>'+
          '<div class="wy11-divider"></div>'+
          '<div>'+
            '<div class="wy11-side-title">研究资产</div>'+
            '<button class="wy11-nav '+(active==='library'?'active':'')+'" data-wy11-nav="library">文献库</button>'+
            '<button class="wy11-nav '+(active==='artifacts'?'active':'')+'" data-wy11-nav="artifacts">学术成果</button>'+
          '</div>'+
          '<div class="wy11-side-note">'+
            (state.wy11UserMode==='old'
              ?'已有任务可以直接恢复到上次工作阶段；文献库和学术成果继续被不同任务复用。'
              :'任务按研究选题组织；文献库和学术成果会随着研究过程逐步沉淀。')+
          '</div>'+
        '</div>';
      }

      function applyCommonSidebar(){
        if(document.body.classList.contains('prelogin'))return;
        if(document.body.classList.contains('task-setup'))return;
        if(document.body.classList.contains('wy-outline-v8'))return;
        if(document.body.classList.contains('wy11-review-form'))return;

        const side=document.querySelector('.sidebar');
        if(side)side.innerHTML=sideInner();

        const head=document.querySelector('.chat-head span');
        if(head && !(state.view==='recommend' && state.wyFind?.stage==='workspace'))head.textContent='文优小助手';
      }

      function showNewUserSelector(){
        document.body.classList.add('prelogin');
        document.body.classList.remove('task-setup','wy-outline-v8','wy11-review-form');
        const login=document.querySelector('#loginV2');
        const select=document.querySelector('#selectV2');
        if(login)login.hidden=true;
        if(select)select.hidden=false;
        document.querySelectorAll('.onboarding-screen').forEach(x=>x.hidden=true);
      }

      function enterApp(){
        document.body.classList.remove('prelogin');
        document.querySelectorAll('.onboarding-screen').forEach(x=>x.hidden=true);
        const login=document.querySelector('#loginV2');
        const select=document.querySelector('#selectV2');
        if(login)login.hidden=true;
        if(select)select.hidden=true;
        document.body.classList.add('wy11-modern');
      }

      function renderOldHome(){
        const wb=document.querySelector('#workBody');
        if(!wb)return;
        document.body.classList.remove('task-setup','wy-outline-v8','wy11-review-form');

        wb.innerHTML=
          '<div class="wy11-old-home">'+
            '<div class="wy11-old-kicker">欢迎回来</div>'+
            '<h1>继续你的研究任务</h1>'+
            '<p>你已经有进行中的任务和研究资产。这里不是新用户的任务选择页，而是恢复已有工作、继续研究的工作台。</p>'+
            '<div class="wy11-old-grid">'+
              '<section class="wy11-old-card">'+
                '<h2>进行中的任务</h2><p>点击任务即可恢复到对应阶段。</p>'+
                '<div class="wy11-resume-list">'+
                  '<button class="wy11-resume primary-task" data-wy11-resume="review"><b>文献综述 · 低空经济发展的影响因素研究</b><em>进行中 · 待确认大纲</em><span>材料准备已经完成，继续后直接进入大纲确认。</span></button>'+
                  '<button class="wy11-resume" data-wy11-resume="proposal"><b>开题报告 · 低空经济发展的影响因素研究</b><em>未开始</em><span>可以直接调用当前研究资产开始。</span></button>'+
                  '<button class="wy11-resume" data-wy11-resume="draft"><b>论文初稿 · 低空经济发展的影响因素研究</b><em>未开始</em><span>可独立创建，不要求先完成开题报告。</span></button>'+
                '</div>'+
              '</section>'+
              '<section class="wy11-old-card">'+
                '<h2>已有研究资产</h2><p>这些内容会继续被任务调用。</p>'+
                '<div class="wy11-old-stats">'+
                  '<div class="wy11-old-stat"><b>63</b><span>文献库</span></div>'+
                  '<div class="wy11-old-stat"><b>31</b><span>批注</span></div>'+
                  '<div class="wy11-old-stat"><b>14</b><span>术语</span></div>'+
                  '<div class="wy11-old-stat"><b>3</b><span>学术成果</span></div>'+
                '</div>'+
                '<div class="actions" style="justify-content:flex-start;margin-top:12px">'+
                  '<button class="small-btn primary" data-wy11-old-nav="library">打开文献库</button>'+
                  '<button class="small-btn" data-wy11-old-nav="artifacts">查看学术成果</button>'+
                  '<button class="small-btn" data-open-task>新建任务</button>'+
                '</div>'+
              '</section>'+
            '</div>'+
          '</div>';
      }

      function renderOldChat(){
        const head=document.querySelector('.chat-head span');
        if(head)head.textContent='文优小助手';
        const list=document.querySelector('#chatList');
        if(list)list.innerHTML=
          '<div class="message">'+
            '<div class="status-row"><span class="status-dot"></span><span>已恢复你的研究上下文</span></div>'+
            '<p>上次停留在「文献综述 · 大纲确认」阶段。</p>'+
            '<p class="muted">已有文献 63 篇 · 批注 31 条 · 术语 14 个 · 学术成果 3 项</p>'+
            '<div class="message-actions"><button class="small-btn primary" data-wy11-resume="review">继续文献综述</button><button class="small-btn" data-wy11-old-nav="library">打开文献库</button></div>'+
          '</div>'+
          '<div class="message"><div class="status-row"><span class="status-dot"></span><span>你也可以开始新的任务</span></div><p>现有研究资产可以直接复用，不需要从头准备。</p></div>';
      }

      /* Current renderDoc already contains the Find Papers override. Keep it. */
      const wy11OldRenderDoc=renderDoc;
      renderDoc=function(){
        if(state.view==='oldHome'){
          renderOldHome();
          document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
          return;
        }
        wy11OldRenderDoc();
      };

      /* Current renderChat already contains the Find Papers assistant. Keep it. */
      const wy11OldRenderChat=renderChat;
      renderChat=function(){
        if(state.view==='oldHome'){
          renderOldChat();
          return;
        }
        wy11OldRenderChat();
        const head=document.querySelector('.chat-head span');
        if(head && !(state.view==='recommend' && state.wyFind?.stage==='workspace'))head.textContent='文优小助手';
      };

      const wy11OldRenderAll=renderAll;
      renderAll=function(){
        wy11OldRenderAll();
        setTimeout(applyCommonSidebar,0);
      };

      /* ---------- Review form layout only; requirement logic remains untouched ---------- */
      const wy11OldReviewCreate=renderReviewCreate;
      renderReviewCreate=function(){
        state.wy11NewTask=state.wy11NewTask||'review';
        document.body.classList.add('wy11-modern','wy11-review-form','task-setup');
        document.body.classList.remove('wy-outline-v8');

        wy11OldReviewCreate();

        setTimeout(()=>{
          const wb=document.querySelector('#workBody');
          if(!wb || wb.querySelector('.wy11-form-shell'))return;

          const title=wb.querySelector('.page-title');
          const layout=wb.querySelector('.create-review-layout');
          const mainCard=layout?.querySelector('section.create-card');
          if(!title || !mainCard)return;

          const back=title.querySelector('[data-wy-review-back]');
          if(back)back.textContent=state.wy11UserMode==='old'?'返回工作台':'返回任务选择';

          const sub=title.querySelector('p');
          if(sub)sub.textContent='填写本次文献综述要求，并让文献需求实时联动个人文献库。';

          const shell=document.createElement('div');
          shell.className='wy11-form-shell';

          const side=document.createElement('aside');
          side.className='wy11-form-side';
          side.innerHTML=sideInner('review');

          const main=document.createElement('section');
          main.className='wy11-form-main';

          wb.innerHTML='';
          shell.appendChild(side);
          shell.appendChild(main);
          wb.appendChild(shell);
          main.appendChild(title);
          main.appendChild(mainCard);
        },0);
      };

      function routeReview(){
        state.wy11NewTask=state.wy11NewTask||'review';
        document.body.classList.remove('wy11-review-form');
        if(state.analysisDone){
          state.view='review';
          renderAll();
        }else{
          state.view='reviewCreate';
          renderReviewCreate();
        }
      }

      function routeFromNewSelector(label){
        setUserMode('new');
        enterApp();

        if(label.includes('文献综述')){
          state.wy11NewTask='review';
          state.analysisDone=false;
          state.outlineEdited=false;
          state.view='reviewCreate';
          renderReviewCreate();
          return;
        }
        if(label.includes('开题报告')){
          state.wy11NewTask='proposal';
          state.view='proposal';
          renderAll();
          return;
        }
        if(label.includes('论文初稿')){
          state.wy11NewTask='draft';
          state.view='draft';
          renderAll();
          return;
        }
        if(label.includes('文献推荐')){
          state.wy11NewTask=null;
          state.view='recommend';
          if(state.wyFind){state.wyFind.stage='setup';state.wyFind.page=0}
          renderAll();
          return;
        }
        if(label.includes('精读')){
          state.wy11NewTask=null;
          state.view='library';
          renderAll();
          return;
        }
        state.wy11NewTask=null;
        state.view='assets';
        renderAll();
      }

      function resumeOldReview(){
        setUserMode('old');
        enterApp();
        document.body.classList.remove('wy11-review-form');
        state.analysisDone=true;
        state.outlineEdited=false;
        state.view='review';
        renderAll();
        setTimeout(()=>window.__renderOutlineV8?.(),0);
      }

      /* Capture only entry/routing events where the base prototype would otherwise
         show the legacy home. Do NOT change the selector UI itself. */
      document.addEventListener('click',e=>{
        const b=e.target.closest('button,[data-v2-option]');
        if(!b)return;

        if(b.matches('[data-v2-new]')){
          setUserMode('new');
          state.wy11NewTask=null;
          /* Let the prototype's original handler show #selectV2 unchanged. */
          return;
        }

        if(b.matches('[data-v2-login]')){
          e.preventDefault();
          e.stopImmediatePropagation();
          setUserMode('old');
          enterApp();
          state.view='oldHome';
          renderAll();
          toast('欢迎回来，已载入你的历史任务与研究资产');
          return;
        }

        if(b.matches('[data-v2-option]')){
          e.preventDefault();
          e.stopImmediatePropagation();
          routeFromNewSelector(b.dataset.v2Option||b.innerText||'');
          return;
        }

        if(b.matches('[data-wy-review-back]')){
          e.preventDefault();
          e.stopImmediatePropagation();
          document.body.classList.remove('wy11-review-form','task-setup');
          if(state.wy11UserMode==='old'){
            state.view='oldHome';
            renderAll();
          }else{
            showNewUserSelector();
          }
          return;
        }

        if(b.matches('[data-wy11-nav]')){
          e.preventDefault();
          e.stopImmediatePropagation();
          const v=b.dataset.wy11Nav;
          document.body.classList.remove('wy11-review-form','task-setup','wy-outline-v8');

          if(v==='review'){
            if(state.wy11UserMode==='old')resumeOldReview();
            else routeReview();
          }else{
            if(state.wy11UserMode==='new' && ['proposal','draft'].includes(v))state.wy11NewTask=v;
            state.view=v;
            renderAll();
          }
          return;
        }

        if(b.matches('[data-wy11-resume]')){
          e.preventDefault();
          e.stopImmediatePropagation();
          const v=b.dataset.wy11Resume;
          if(v==='review')resumeOldReview();
          else{
            setUserMode('old');
            state.view=v;
            renderAll();
          }
          return;
        }

        if(b.matches('[data-wy11-old-nav]')){
          e.preventDefault();
          e.stopImmediatePropagation();
          setUserMode('old');
          state.view=b.dataset.wy11OldNav;
          renderAll();
          return;
        }
      },true);

      /* The prototype may call renderReviewCreate directly after entering from the
         selector. Re-apply the latest form layout after any such render. */
      document.addEventListener('click',e=>{
        const b=e.target.closest('button');
        if(!b)return;

        if(b.matches('[data-wy-review-primary],[data-wy-force-generate]')){
          document.body.classList.remove('wy11-review-form');
        }

        if(b.matches('[data-wy-find-back-review]')){
          setTimeout(()=>renderReviewCreate(),0);
        }

        if(b.matches('[data-wy8-confirm]')){
          document.body.classList.remove('wy11-review-form');
        }
      },true);

      /* Keep the common shell current after asynchronous search transitions. */
      setInterval(()=>{
        if(document.body.classList.contains('prelogin'))return;
        document.body.classList.add('wy11-modern');
        applyCommonSidebar();
      },350);
    })();
