<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>文优小助 Demo · 文献综述文献需求联动</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f8fc}
    iframe{border:0;width:100%;height:100%;display:block}
  </style>
</head>
<body>
<iframe id="wenyouFrame" src="../wenyouxiaozhu-prototype.html" title="文优小助产品重构 Demo"></iframe>
<script>
const frame=document.getElementById('wenyouFrame');

frame.addEventListener('load',()=>{
  const d=frame.contentDocument;
  if(!d || d.getElementById('wy-review-req-patch')) return;

  const style=d.createElement('style');
  style.id='wy-review-req-patch';
  style.textContent=`
    .wy-req-shell{display:grid;gap:11px}
    .wy-req-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
    .wy-req-total{display:flex;align-items:center;gap:7px;font-size:11px}
    .wy-req-total input{width:78px;height:34px;border:1px solid var(--line);border-radius:7px;padding:0 8px;font-size:12px}
    .wy-system-rec{display:inline-flex;align-items:center;gap:5px;padding:6px 8px;border-radius:7px;background:var(--purple-weak);color:var(--purple);font-size:10px}
    .wy-discipline{display:flex;align-items:center;gap:7px;font-size:11px}
    .wy-discipline select{height:34px;border:1px solid var(--line);border-radius:7px;background:#fff;padding:0 9px;font-size:11px;min-width:180px}
    .wy-expand{height:32px;padding:0 10px;border:1px solid var(--line);border-radius:7px;background:#fff;color:#525b70;font-size:10px}
    .wy-req-detail{display:none;padding:11px;border:1px solid #ded8f8;border-radius:8px;background:#fbfaff}
    .wy-req-detail.open{display:grid;gap:8px}
    .wy-req-tip{color:var(--muted);font-size:10px;line-height:1.55}
    .wy-req-row{display:grid;grid-template-columns:minmax(150px,1fr) 92px 118px 88px;gap:8px;align-items:center;padding:9px;border:1px solid var(--line);border-radius:7px;background:#fff}
    .wy-req-name strong{display:block;font-size:11px}.wy-req-name small{display:block;margin-top:2px;color:var(--muted);font-size:9px}
    .wy-req-row input{width:100%;height:30px;border:1px solid var(--line);border-radius:6px;padding:0 7px;font-size:11px}
    .wy-kind{display:flex;padding:2px;border-radius:6px;background:#f0f2f6}
    .wy-kind button{flex:1;border:0;background:transparent;border-radius:5px;padding:5px 4px;color:#788093;font-size:9px}
    .wy-kind button.active{background:#fff;color:var(--purple);font-weight:700;box-shadow:0 1px 2px rgba(40,42,60,.08)}
    .wy-match{text-align:right;font-size:10px;color:var(--muted)}.wy-match.good{color:var(--teal)}.wy-match.warn{color:var(--amber)}
    .wy-library-check{border:1px solid #dcd6f5;border-radius:9px;background:#fcfbff;padding:12px}
    .wy-check-head{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:11px}
    .wy-spinner{width:13px;height:13px;border:2px solid #ddd7f4;border-top-color:var(--purple);border-radius:50%;display:none;animation:wyspin .7s linear infinite}
    .wy-library-check.checking .wy-spinner{display:inline-block}@keyframes wyspin{to{transform:rotate(360deg)}}
    .wy-check-title{display:flex;align-items:center;gap:7px;font-weight:700}
    .wy-progress{height:6px;border-radius:999px;background:#eceef4;overflow:hidden;margin:9px 0}
    .wy-progress i{display:block;height:100%;background:var(--purple);border-radius:999px;transition:.25s}
    .wy-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
    .wy-metric{padding:8px;border:1px solid var(--line);border-radius:7px;background:#fff}
    .wy-metric b{display:block;color:var(--purple);font-size:16px}.wy-metric span{font-size:9px;color:var(--muted)}
    .wy-gap{margin-top:9px;padding:9px 10px;border-radius:7px;background:var(--amber-weak);color:#77511b;font-size:10px;line-height:1.55}
    .wy-gap.good{background:var(--teal-weak);color:#246a63}
    .wy-upload{display:grid;gap:8px;padding:11px;border:1px dashed #b9afea;border-radius:7px;background:#fbfaff}
    .wy-upload-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
    .wy-upload strong{font-size:11px;color:var(--purple)}.wy-upload small{font-size:9px;color:var(--muted);line-height:1.5}
    .wy-upload-actions{display:flex;gap:7px;flex-wrap:wrap}
    .wy-upload input[type=file]{display:none}
    .wy-upload-status{font-size:10px;color:var(--muted)}
    .wy-create-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:15px;padding-top:14px;border-top:1px solid var(--line)}
    .wy-create-footer .hint{max-width:58%;font-size:10px;color:var(--muted);line-height:1.55}
    .wy-create-footer .actions{display:flex;gap:7px}
    .wy-demo-btn{height:30px;padding:0 9px;border:1px dashed #bcb3e7;border-radius:7px;background:#fff;color:#6d5ab0;font-size:9px}
    @media(max-width:900px){.wy-req-row{grid-template-columns:1fr 85px 110px}.wy-match{grid-column:1/-1;text-align:left}.wy-metrics{grid-template-columns:repeat(2,1fr)}.wy-create-footer{align-items:flex-start;flex-direction:column}.wy-create-footer .hint{max-width:none}}
  `;
  d.head.appendChild(style);

  const patch=d.createElement('script');
  patch.textContent=String.raw`
    (function(){
      const WY_DISCIPLINES={
        econ:{
          label:'经济 / 管理 / 社会科学',
          reqs:[
            {id:'ssci',name:'SSCI',desc:'社会科学引文索引',need:5,base:1,kind:'must'},
            {id:'cssci',name:'CSSCI',desc:'中文社会科学引文索引',need:5,base:2,kind:'must'},
            {id:'jcr12',name:'JCR Q1–Q2',desc:'JCR 高分区期刊',need:3,base:1,kind:'prefer'},
            {id:'recent',name:'近 5 年',desc:'保证研究时效性',need:12,base:3,kind:'prefer'}
          ]
        },
        cs:{
          label:'计算机 / AI / 信息科学',
          reqs:[
            {id:'ccf',name:'CCF A/B',desc:'计算机高质量会议 / 期刊',need:4,base:1,kind:'must'},
            {id:'scie',name:'SCIE',desc:'Science Citation Index Expanded',need:8,base:2,kind:'must'},
            {id:'jcr12',name:'JCR Q1–Q2',desc:'JCR 高分区期刊',need:4,base:1,kind:'prefer'},
            {id:'recent',name:'近 5 年',desc:'快速变化领域优先近期研究',need:14,base:3,kind:'prefer'}
          ]
        },
        stem:{
          label:'理工 / 材料 / 环境',
          reqs:[
            {id:'scie',name:'SCIE',desc:'自然科学与工程主流收录',need:10,base:2,kind:'must'},
            {id:'cas12',name:'中科院 1–2 区',desc:'按中科院期刊分区',need:5,base:1,kind:'prefer'},
            {id:'ei',name:'EI Compendex',desc:'工程技术重要文献来源',need:5,base:1,kind:'prefer'},
            {id:'recent',name:'近 5 年',desc:'保证研究时效性',need:12,base:3,kind:'prefer'}
          ]
        },
        med:{
          label:'医学 / 生命科学',
          reqs:[
            {id:'scie',name:'SCIE',desc:'医学 / 生命科学主流收录',need:10,base:2,kind:'must'},
            {id:'jcr12',name:'JCR Q1–Q2',desc:'优先较高质量期刊',need:6,base:1,kind:'prefer'},
            {id:'rct',name:'RCT / 系统综述',desc:'高证据等级研究类型',need:5,base:1,kind:'prefer'},
            {id:'recent',name:'近 5 年',desc:'优先近期临床证据',need:12,base:3,kind:'prefer'}
          ]
        },
        human:{
          label:'人文 / 法学 / 文史哲',
          reqs:[
            {id:'ahci',name:'A&HCI',desc:'艺术与人文引文索引',need:3,base:0,kind:'prefer'},
            {id:'cssci',name:'CSSCI',desc:'中文社会科学引文索引',need:8,base:2,kind:'must'},
            {id:'pkucore',name:'北大核心',desc:'中文核心期刊来源',need:8,base:2,kind:'prefer'},
            {id:'recent',name:'近 8 年',desc:'兼顾经典与近期研究',need:10,base:3,kind:'prefer'}
          ]
        }
      };

      function wyInitState(){
        state.wyReview=state.wyReview||{
          total:20,
          discipline:'econ',
          uploaded:0,
          duplicate:0,
          expanded:false,
          reqs:JSON.parse(JSON.stringify(WY_DISCIPLINES.econ.reqs))
        };
        return state.wyReview;
      }
      function wyHave(req){
        const s=wyInitState(),u=s.uploaded;
        if(req.id==='recent') return Math.min(s.total,req.base+Math.round(u*.8));
        if(req.id==='ssci'||req.id==='scie'||req.id==='cssci') return Math.min(s.total,req.base+Math.floor(u/2));
        if(req.id==='ccf'||req.id==='pkucore') return Math.min(s.total,req.base+Math.floor(u/3));
        if(req.id==='jcr12'||req.id==='cas12'||req.id==='rct'||req.id==='ei'||req.id==='ahci') return Math.min(s.total,req.base+Math.floor(u/4));
        return req.base;
      }
      function wyUsable(){return 3+wyInitState().uploaded}
      function wyHardMissing(){
        const s=wyInitState();
        return s.reqs.filter(r=>r.kind==='must'&&wyHave(r)<r.need);
      }
      function wySatisfied(){
        const s=wyInitState();
        return wyUsable()>=s.total&&wyHardMissing().length===0;
      }
      function wyGapText(){
        const s=wyInitState(),parts=[];
        const g=Math.max(0,s.total-wyUsable());
        if(g) parts.push('总量还缺 '+g+' 篇');
        wyHardMissing().forEach(r=>parts.push(r.name+' 至少还缺 '+(r.need-wyHave(r))+' 篇'));
        return parts.length?parts.join('；'):'已满足本次任务的必须要求';
      }
      function wyReqRows(){
        const s=wyInitState();
        return s.reqs.map((r,i)=>'<div class="wy-req-row"><div class="wy-req-name"><strong>'+r.name+'</strong><small>'+r.desc+'</small></div><input data-wy-need="'+i+'" type="number" min="0" max="'+s.total+'" value="'+r.need+'"><div class="wy-kind"><button type="button" class="'+(r.kind==='must'?'active':'')+'" data-wy-kind="'+i+'" data-kind="must">必须满足</button><button type="button" class="'+(r.kind==='prefer'?'active':'')+'" data-wy-kind="'+i+'" data-kind="prefer">优先满足</button></div><div class="wy-match '+(wyHave(r)>=r.need?'good':'warn')+'"><b>'+wyHave(r)+'</b> / ≥'+r.need+'</div></div>').join('');
      }
      function wyRequirementHTML(){
        const s=wyInitState(),ok=wySatisfied(),usable=wyUsable();
        return '<div class="wy-req-shell">'+
          '<div class="wy-req-head"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><div class="wy-req-total"><span>文献需求</span><input id="wyTotal" type="number" min="0" max="80" value="'+s.total+'"><span>篇</span></div><span class="wy-system-rec">系统建议 · 文献综述 '+s.total+' 篇</span><div class="wy-discipline"><span>学科</span><select id="wyDiscipline">'+Object.entries(WY_DISCIPLINES).map(([k,v])=>'<option value="'+k+'" '+(k===s.discipline?'selected':'')+'>'+v.label+'</option>').join('')+'</select></div></div><button class="wy-expand" id="wyExpand">'+(s.expanded?'收起详细要求 ▴':'展开详细要求 ▾')+'</button></div>'+
          '<div class="wy-req-detail '+(s.expanded?'open':'')+'" id="wyReqDetail"><div class="wy-req-tip">按学科提供质量评价项。同一篇论文可同时满足“收录体系 / 分区 / 年份”等多个非互斥条件；“必须满足”影响是否达标，“优先满足”只形成补充建议。</div>'+wyReqRows()+'</div>'+
          '<div class="wy-library-check" id="wyLibraryCheck"><div class="wy-check-head"><div class="wy-check-title"><i class="wy-spinner"></i><span id="wyCheckTitle">已连接你的文献库</span></div><span>'+usable+' / '+s.total+' 篇可用</span></div><div class="wy-progress"><i style="width:'+Math.min(100,s.total?usable/s.total*100:100)+'%"></i></div><div class="wy-metrics"><div class="wy-metric"><b>63</b><span>个人文献库</span></div><div class="wy-metric"><b>6</b><span>与当前选题相关</span></div><div class="wy-metric"><b>3</b><span>库内全文解析完成</span></div><div class="wy-metric"><b>'+usable+'</b><span>本次可用</span></div></div><div class="wy-gap '+(ok?'good':'')+'">'+(ok?'✓ 已满足本次任务文献要求，可进入生成。':'⚠ 当前建议补充：'+wyGapText()+'。')+'</div></div>'+
        '</div>';
      }
      function wyBind(){
        const s=wyInitState();
        const total=document.querySelector('#wyTotal');
        if(total){
          total.addEventListener('change',()=>{s.total=Math.max(0,Math.min(80,Number(total.value)||0));s.reqs.forEach(r=>r.need=Math.min(r.need,s.total));wyRecheck(true)});
          total.addEventListener('blur',()=>wyRecheck(true));
        }
        const dis=document.querySelector('#wyDiscipline');
        if(dis)dis.addEventListener('change',()=>{s.discipline=dis.value;s.reqs=JSON.parse(JSON.stringify(WY_DISCIPLINES[dis.value].reqs));wyRecheck(true)});
        const exp=document.querySelector('#wyExpand');
        if(exp)exp.addEventListener('click',()=>{s.expanded=!s.expanded;renderReviewCreate()});
        document.querySelectorAll('[data-wy-need]').forEach(inp=>inp.addEventListener('change',()=>{const r=s.reqs[Number(inp.dataset.wyNeed)];r.need=Math.max(0,Math.min(s.total,Number(inp.value)||0));wyRecheck(true)}));
        document.querySelectorAll('[data-wy-kind]').forEach(btn=>btn.addEventListener('click',()=>{s.reqs[Number(btn.dataset.wyKind)].kind=btn.dataset.kind;renderReviewCreate()}));
        const file=document.querySelector('#wyUpload');
        if(file)file.addEventListener('change',()=>{
          const count=file.files?file.files.length:0;
          const dup=count>=5?1:0;
          s.duplicate=dup;
          s.uploaded=Math.max(0,count-dup);
          renderReviewCreate();
          toast('已查重：'+s.uploaded+' 篇新增全文进入文献库'+(dup?'，'+dup+' 篇重复已忽略':''));
        });
      }
      function wyRecheck(showLoading){
        const card=document.querySelector('#wyLibraryCheck');
        if(showLoading&&card){
          card.classList.add('checking');
          const t=document.querySelector('#wyCheckTitle');if(t)t.textContent='正在按选题和质量要求匹配文献库…';
          setTimeout(()=>renderReviewCreate(),520);
        }else renderReviewCreate();
      }

      enhanceReviewCreate=function(){};

      renderReviewCreate=function(){
        const s=wyInitState(),usable=wyUsable(),ok=wySatisfied();
        document.querySelector('#workBody').innerHTML=
          pageTitle('创建文献综述','保留当前任务填写方式，在文献需求处实时联动个人文献库。','<button class="ghost" data-wy-review-back>返回开始任务</button>')+
          '<div class="create-review-layout"><section class="create-card"><h2>任务信息</h2><p>先补充本次综述的写作要求。文献需求为选填，系统会按任务类型给出默认建议。</p><div class="create-form">'+
          '<div class="create-form-row"><label>当前选题</label><div class="topic-chip"><strong>市场需求对中国省级旅游产业技术演化的影响</strong><span>已关联</span></div></div>'+
          '<div class="create-form-row"><label>* 标题</label><input id="reviewTopic" value="市场需求对中国省级旅游产业技术演化的影响"></div>'+
          '<div class="create-form-row"><label>研究方向</label><input id="wyDirection" value="旅游产业技术演化与区域市场需求" placeholder="请输入研究方向"></div>'+
          '<div class="create-form-row"><label>研究问题</label><textarea id="wyQuestion" placeholder="例如：市场需求如何影响省级旅游产业技术演化？">市场需求如何影响省级旅游产业技术演化？现有研究有哪些共同结论与不足？</textarea></div>'+
          '<div class="create-form-row"><label>* 字数</label><div class="word-row"><input id="wyWords" value="5000"><span class="muted">字</span></div></div>'+
          '<div class="create-form-row"><label>文献需求</label><div>'+wyRequirementHTML()+'</div></div>'+
          '<div class="create-form-row"><label>上传相关文献</label><div class="wy-upload"><div class="wy-upload-head"><div><strong>上传全文后自动查重并进入文献库</strong><br><small>只有“已入库 + 有全文 + 解析完成”的文献才计入本次可用数量。</small></div><div class="wy-upload-actions"><label class="small-btn primary" for="wyUpload">选择本地文件</label><input id="wyUpload" type="file" accept=".pdf,.ris,.bib" multiple><button class="wy-demo-btn" type="button" data-wy-sim-upload>原型：模拟加入 8 篇</button></div></div><div class="wy-upload-status">'+(s.uploaded?'本次新增 '+s.uploaded+' 篇全文'+(s.duplicate?' · 已忽略 '+s.duplicate+' 篇重复文献':''):'尚未上传本次任务文献')+'</div></div></div>'+
          '<div class="create-form-row"><label>可选成果</label><div class="asset-check"><label class="asset-check-row"><input type="checkbox"> 使用已有学术成果 <small>当前暂无可关联成果</small></label><button class="small-btn" data-view="artifacts">查看学术成果</button></div></div>'+
          '</div><div class="wy-create-footer"><div class="hint">'+(ok?'文献数量与必须质量条件均已满足，可以开始生成。':'当前材料未完全满足要求。主操作优先补文献，但仍允许使用现有材料继续。')+'</div><div class="actions">'+(ok?'':'<button class="ghost" data-wy-force-generate>仍使用现有 '+usable+' 篇生成</button>')+'<button class="primary" data-wy-review-primary>'+(ok?'开始生成':'找文献')+'</button></div></div></section>'+
          '<aside class="create-side"><section class="create-card"><h2>文献需求如何联动？</h2><p>系统不会把“文献需求”当作普通 Prompt，而是直接检查个人研究资产。</p><div class="prepare-list"><div class="prepare-step"><i>1</i><div><strong>按选题匹配文献库</strong><small>先从全局个人文献库找到当前任务相关论文</small></div></div><div class="prepare-step"><i>2</i><div><strong>只计算可用全文</strong><small>仅全文存在且解析完成的文献进入可用数量</small></div></div><div class="prepare-step"><i>3</i><div><strong>按学科检查质量要求</strong><small>经济社科、计算机、理工、医学、人文使用不同评价体系</small></div></div><div class="prepare-step"><i>4</i><div><strong>实时计算缺口</strong><small>上传文献后立即查重、入库并重新计算</small></div></div></div></section><div class="create-note">材料不足时进入「找文献」；满足要求或用户选择继续时进入「生成 Paper」。两个后续分支暂时沿用现有 Demo，下一轮再分别重构。</div></aside></div>';
        document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.view==='review'));
        wyBind();
      };

      document.addEventListener('change',e=>{
        if(e.target.matches('#wyDirection,#wyQuestion,#wyWords')) wyRecheck(true);
      });

      document.addEventListener('click',e=>{
        const b=e.target.closest('button');
        if(!b)return;
        if(b.matches('[data-wy-review-back]')){
          document.body.classList.remove('task-setup');
          state.view='home';
          renderAll();
        }
        if(b.matches('[data-wy-sim-upload]')){
          const s=wyInitState();
          s.uploaded+=8;
          renderReviewCreate();
          toast('原型模拟：新增 8 篇全文，已重新计算文献需求');
        }
        if(b.matches('[data-wy-review-primary]')){
          document.body.classList.remove('task-setup');
          if(wySatisfied()){
            state.analysisDone=true;
            state.outlineEdited=false;
            state.view='review';
            toast('材料满足要求，进入生成 Paper 分支');
            renderAll();
          }else{
            state.view='recommend';
            state.wyReviewGap=wyGapText();
            toast('当前材料不足，进入找文献分支');
            renderAll();
          }
        }
        if(b.matches('[data-wy-force-generate]')){
          document.body.classList.remove('task-setup');
          state.analysisDone=true;
          state.outlineEdited=false;
          state.view='review';
          toast('已确认使用现有材料，进入生成 Paper 分支');
          renderAll();
        }
      },true);
    })();
  `;
  d.body.appendChild(patch);
});
</script>

<script>
frame.addEventListener('load',()=>{
  const d=frame.contentDocument;
  if(!d || d.getElementById('wy-find-branch-patch')) return;

  const style=d.createElement('style');
  style.id='wy-find-branch-patch';
  style.textContent=`
    .wy-find-config{max-width:930px;margin:0 auto}
    .wy-find-config-grid{display:grid;grid-template-columns:minmax(0,1.18fr) minmax(280px,.82fr);gap:14px}
    .wy-find-card{background:#fff;border:1px solid var(--line);border-radius:9px;padding:16px}

          '</div><div class="wy-find-estimate">预计形成约 <b>'+pool+' 篇候选文献</b>。候选池主要依据元数据和可用摘要初筛，全文相关性将在入库解析后再次判断。</div></div>'+
          '<div class="actions" style="justify-content:flex-end;margin-top:13px"><button class="primary" data-wy-start-search>开始检索</button></div></section>'+
          '<aside class="wy-find-card"><h2>为什么候选数高于最终需求？</h2><p>检索阶段只能判断“值得获取全文”，不能确认正文一定能用于写作。</p>'+
          '<div class="prepare-list"><div class="prepare-step"><i>1</i><div><strong>多数据库广泛检索</strong><small>原始结果可能达到数百篇</small></div></div><div class="prepare-step"><i>2</i><div><strong>Metadata 去重和初筛</strong><small>根据题目、关键词、年份和文献层次筛选</small></div></div><div class="prepare-step"><i>3</i><div><strong>形成 2–4 倍候选池</strong><small>为后续全文筛选保留冗余</small></div></div><div class="prepare-step"><i>4</i><div><strong>获取全文后再次筛选</strong><small>真正进入写作的文献必须全文解析可用</small></div></div></div></aside></div></div>';
      }
      function wySearchRunning(){
        const f=wyFindInit(),steps=[
          ['生成检索式','根据选题拆解中英文关键词与查询组合'],
          ['多数据库检索','并行查询已选择的外文与中文数据库'],
          ['Metadata 归一化与去重','合并 DOI、标题、作者与年份信息'],
          ['文献层次筛选','按 SSCI / CSSCI / JCR 等需求筛选'],
          ['主题聚类与相关性排序','形成结构化候选文献池']
        ];
        document.body.classList.add('task-setup');
        return pageTitle('正在检索文献','本次检索目标约 '+wyPool()+' 篇候选文献。','')+
          '<section class="surface wy-search-run"><div class="wy-run-hero"><h2>正在建立候选文献池</h2><p>检索过程只使用元数据与可用摘要，不把候选论文直接视为最终写作材料。</p></div><div class="progress"><i style="width:'+Math.min(100,(f.runStep+1)/steps.length*100)+'%"></i></div><div class="wy-run-list">'+steps.map((s,i)=>'<div class="wy-run-item '+(i<f.runStep?'done':i===f.runStep?'current':'')+'"><i>'+(i<f.runStep?'✓':i+1)+'</i><div><strong>'+s[0]+'</strong><small>'+s[1]+'</small></div></div>').join('')+'</div></section>';
      }
      function wyDemandRows(){
        return state.wyReview.reqs.filter(r=>r.need>0).map(r=>{
          const c=wyReqCandidate(r),cur=wyReqCurrent(r),ok=cur>=r.need;
          return '<tr><td><b>'+r.name+'</b><br><span class="muted">'+(r.kind==='must'?'必须满足':'优先满足')+'</span></td><td>≥ '+r.need+'</td><td>'+c+'</td><td>'+wyReqOA(r)+'</td><td>'+wyReqExternal(r)+'</td><td>'+cur+'</td><td class="'+(ok?'wy-status-ok':'wy-status-gap')+'">'+(ok?'已满足':'还缺 '+(r.need-cur))+'</td></tr>';
        }).join('');
      }
      function wyL1(){
        const status=wyFindStatus(),f=wyFindInit(),current=wyCurrentFull(),total=state.wyReview.total;
        return '<section class="wy-find-section"><div class="wy-overview"><div><h2>本次文献需求满足情况</h2><p>候选池回答“系统找到了什么”，当前全文回答“真正已经可以进入任务的材料有多少”。</p></div><div class="wy-overview-score"><strong>'+current+' / '+total+'</strong><small>当前可用全文</small></div></div>'+
          '<table class="wy-demand-table"><thead><tr><th>文献要求</th><th>我的需求</th><th>候选池</th><th>可一键获取</th><th>需自行下载</th><th>当前全文</th><th>状态</th></tr></thead><tbody><tr><td><b>总文献</b></td><td>'+total+'</td><td>'+wyPool()+'</td><td>'+wyOACount()+'</td><td>'+wyExternalCount()+'</td><td>'+current+'</td><td class="'+(current>=total?'wy-status-ok':'wy-status-gap')+'">'+(current>=total?'数量已达标':'还缺 '+(total-current))+'</td></tr>'+wyDemandRows()+'</tbody></table></section>'+
          '<section class="wy-find-section"><h3>全文获取方式</h3><div class="wy-fulltext-grid"><div class="wy-fulltext-card"><span class="wy-full-status oa">OA / 可直接获取</span><div class="big">'+Math.max(0,wyOACount()-f.importedOA)+'</div><small>平台可直接取得全文，入库后自动查重、解析并计入本次任务。</small><button class="small-btn primary" data-wy-bulk-oa '+(f.importedOA?'disabled':'')+'>'+(f.importedOA?'已一键入库 '+f.importedOA+' 篇':'一键入库')+'</button></div>'+
          '<div class="wy-fulltext-card"><span class="wy-full-status external">需前往数据库获取</span><div class="big">'+wyExternalCount()+'</div><small>系统保留完整 Metadata，用户可导出清单后前往对应数据库下载全文。</small><div class="wy-db-breakdown"><span class="wy-db-pill">知网 '+Math.round(wyExternalCount()*.42)+'</span><span class="wy-db-pill">万方 '+Math.round(wyExternalCount()*.28)+'</span><span class="wy-db-pill">其他 '+Math.round(wyExternalCount()*.30)+'</span></div><div class="actions" style="justify-content:flex-start"><button class="small-btn" data-wy-export-list>导出文献 List</button><button class="small-btn primary" data-wy-upload-external>上传已下载全文</button></div></div></div></section>'+
          '<section class="wy-find-section"><h3>当前结论</h3><div class="wy-gap '+(status==='safe'?'good':'')+'">'+(status==='insufficient'?'目前仍不足：'+wyFindGap()+'。':status==='critical'?'已经达到表面文献需求，但全文内容筛选后仍可能低于需求，继续时会进行风险提示。':'已有较充分的全文冗余，可继续进入文献综述。')+'</div></section>';
      }
      function wyL2(){
        const scale=wyPool()/60;
        return '<section class="wy-find-section"><h2>系统检索策略</h2><p>以下内容是结构化 Search Plan，不是模型隐式推理。它告诉用户系统如何把选题拆成可检索的研究方向。</p></section>'+
          '<div class="wy-cluster-grid">'+WY_FIND_CLUSTERS.map(c=>'<article class="wy-cluster"><div class="wy-cluster-head"><div><h3>'+c.name+'</h3><span class="muted">建议最终覆盖约 '+c.keep+' 篇</span></div><span class="wy-cluster-count">'+Math.round(c.count*scale)+' 篇</span></div><div class="wy-query-list">'+c.queries.map(q=>'<span class="wy-query">'+q+'</span>').join('')+'</div><div class="wy-cluster-foot"><span>'+c.db+'</span><span>Metadata 聚类</span></div></article>').join('')+'</div>'+
          '<section class="wy-find-section" style="margin-top:10px"><h3>策略可继续修改</h3><p>'+(wyFindInit().lastAgentUpdate?'<b style="color:var(--purple)">最近调整：</b>'+wyFindInit().lastAgentUpdate:'在中间「文献助手」中输入：少一点国际研究、多找政策机制、只看 CSSCI 等。系统会更新检索策略并刷新候选池。')+'</p><div class="actions" style="justify-content:flex-start"><button class="small-btn" data-wy-rerun-search>按当前策略重新检索</button></div></section>';
      }
      function wyPaperActions(p){
        const f=wyFindInit(),bulkDone=f.importedOA>=wyOACount(),imported=bulkDone||!!f.importedPaperIds[p.id];
        if(p.oa)return '<span class="wy-full-status oa">OA 可获取</span><button class="small-btn primary" data-wy-import-paper="'+p.id+'" '+(imported?'disabled':'')+'>'+(imported?'已入库':'一键入库')+'</button>';
        return '<span class="wy-full-status external">需自行获取</span><button class="small-btn" data-wy-download-paper="'+p.id+'">加入下载清单</button>';
      }
      function wyL3(){
        const scale=wyPool()/60;
        return '<section class="wy-find-section"><h2>候选文献</h2><p>按检索主题聚类。此阶段仅展示 Metadata、文献层次、摘要可用状态和全文获取方式，不把候选文献解释为全文证据。</p></section>'+
          WY_FIND_CLUSTERS.map(c=>'<section class="wy-paper-cluster"><div class="wy-paper-cluster-head"><h3>'+c.name+'</h3><span>候选 '+Math.round(c.count*scale)+' · 建议最终覆盖 '+c.keep+'</span></div>'+
            WY_FIND_PAPERS.filter(p=>p.cluster===c.id).map(p=>'<article class="wy-paper-card"><div><h4>'+p.title+'</h4><div class="wy-paper-meta">'+p.authors+' · '+p.year+' · '+p.venue+'<br>DOI：'+p.doi+' · 来源：'+p.db+' · '+(p.abstract?'摘要可用':'仅基础 Metadata')+'</div><div class="wy-levels">'+p.levels.map(x=>'<span class="wy-level">'+x+'</span>').join('')+p.fit.map(x=>'<span class="wy-level fit">可补 '+x+'</span>').join('')+'</div></div><div class="wy-paper-side">'+wyPaperActions(p)+'</div></article>').join('')+
          '</section>').join('');
      }
      function wyGlobalCTA(){
        const status=wyFindStatus(),current=wyCurrentFull(),total=state.wyReview.total,safe=Math.ceil(total/.75);
        if(status==='insufficient')return '<div class="wy-global-cta"><small>当前 '+current+' / '+total+' 篇；'+wyFindGap()+'。</small><div class="actions"><button class="wy-disabled" disabled>需要继续补充文献</button></div></div>';
        if(status==='critical')return '<div class="wy-global-cta"><small>当前 '+current+' 篇已达到基本要求，但低于建议安全储备 '+safe+' 篇。</small><div class="actions"><button class="primary" data-wy-continue-review>继续文献综述</button></div></div>';
        return '<div class="wy-global-cta"><small>当前 '+current+' 篇，数量与必须质量要求均有较充分冗余。</small><div class="actions"><button class="primary" data-wy-continue-review>继续文献综述</button></div></div>';
      }
      function wyWorkspace(){
        const f=wyFindInit(),page=f.page;
        document.body.classList.remove('task-setup');
        const body=page===0?wyL1():page===1?wyL2():wyL3();
        return '<div class="wy-find-work"><div class="wy-find-top"><button class="wy-page-arrow" data-wy-find-prev '+(page===0?'disabled':'')+'>‹</button><div class="wy-find-tabs"><button class="wy-find-tab '+(page===0?'active':'')+'" data-wy-find-page="0">需求满足情况</button><button class="wy-find-tab '+(page===1?'active':'')+'" data-wy-find-page="1">检索策略</button><button class="wy-find-tab '+(page===2?'active':'')+'" data-wy-find-page="2">候选文献</button></div><button class="wy-page-arrow" data-wy-find-next '+(page===2?'disabled':'')+'>›</button></div>'+body+wyGlobalCTA()+'</div>';
      }
      function wyRenderRecommend(){
        const f=wyFindInit();
        if(f.stage==='setup')return wySearchSetup();
        if(f.stage==='running')return wySearchRunning();
        return wyWorkspace();
      }

      const wyOldRenderRecommend=renderRecommend;
      renderRecommend=function(){
        return wyRenderRecommend();
      };

      const wyOldRenderChat=renderChat;
      renderChat=function(){
        const f=wyFindInit();
        const head=document.querySelector('.chat-head span');
        if(state.view==='recommend'&&f.stage==='workspace'){
          if(head)head.textContent='文献助手';
          document.querySelector('#chatList').innerHTML=
            '<div class="message"><div class="status-row"><span class="status-dot"></span><span>候选池已建立</span></div><p>当前候选 '+wyPool()+' 篇，已按 5 个检索方向聚类。</p><p class="muted">你可以继续修改检索策略，例如“多找政策机制”“只看 CSSCI”“近三年的多一点”。</p><div class="message-actions"><button class="small-btn primary" data-wy-agent-prompt="多找政策与治理机制">多找政策机制</button><button class="small-btn" data-wy-agent-prompt="只看 CSSCI">优先 CSSCI</button></div></div>'+
            (f.lastAgentUpdate?'<div class="message user">'+f.lastAgentUpdate+'</div><div class="message"><p>已更新检索策略，候选文献与主题覆盖已重新排序。</p></div>':'');
          return;
        }
        if(head)head.textContent='任务助手';
        wyOldRenderChat();
      };

      function wyStartRunning(){
        const f=wyFindInit();
        f.stage='running';f.runStep=0;renderAll();
        const tick=()=>{
          if(state.view!=='recommend'||f.stage!=='running')return;
          f.runStep++;
          if(f.runStep>=5){
            f.stage='workspace';f.page=0;document.body.classList.remove('task-setup');renderAll();toast('检索完成：已建立 '+wyPool()+' 篇候选文献池');
          }else{renderAll();setTimeout(tick,420)}
        };
        setTimeout(tick,420);
      }
      function wyExportList(){
        const rows=[['Title','Authors','Year','Venue','DOI','Database','Literature level','Cluster']];
        WY_FIND_PAPERS.filter(p=>!p.oa).forEach(p=>rows.push([p.title,p.authors,p.year,p.venue,p.doi,p.db,p.levels.join(' / '),WY_FIND_CLUSTERS.find(c=>c.id===p.cluster)?.name||'']));
        const csv=rows.map(r=>r.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(',')).join('\\n');
        const blob=new Blob(['\\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
        const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='文优小助_待下载文献List.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
        toast('已导出待下载文献 List');
      }
      function wyRiskModal(){
        const current=wyCurrentFull(),low=Math.floor(current*.75),high=Math.max(low,Math.floor(current*.9));
        document.querySelector('#modalTitle').textContent='当前文献数量处于临界区间';
        document.querySelector('#modalBody').innerHTML='<div class="wy-funnel-wrap"><div class="wy-funnel"><div class="wy-funnel-step"><b>Metadata 候选池</b><br>'+wyPool()+' 篇</div><div class="wy-funnel-step"><b>已获取全文</b><br>'+current+' 篇</div><div class="wy-funnel-step"><b>全文解析 + 内容筛选</b><br>预计保留 '+low+'–'+high+' 篇</div><div class="wy-funnel-step"><b>最终写作材料</b><br>目标 ≥ '+state.wyReview.total+' 篇</div></div><div class="wy-risk-copy"><h3>为什么还要提醒？</h3><p>候选文献最初主要依据题目、关键词、书目信息和可用摘要筛选。进入全文解析后，部分论文可能因为正文与研究问题不匹配而被移出任务。</p><div class="wy-risk-reasons"><div class="wy-risk-reason">Metadata 相关，但正文研究对象不一致</div><div class="wy-risk-reason">只有背景提及，无法作为主要写作材料</div><div class="wy-risk-reason">与其他论文重复，最终只保留更强证据</div></div></div></div>';
        document.querySelector('#modalFoot').innerHTML='<button class="ghost" data-wy-risk-more>继续补充文献</button><button class="primary" data-wy-risk-ack>是的，我已知晓</button>';
        document.querySelector('#modal').classList.add('open');
      }
      function wyContinueReview(){
        const f=wyFindInit();
        state.wyReview.uploaded=Math.max(Number(state.wyReview.uploaded)||0,f.importedOA+f.uploadedExternal);
        state.analysisDone=true;state.outlineEdited=false;state.view='review';
        document.body.classList.remove('task-setup');
        renderAll();
        toast('已返回文献综述，进入生成 Paper 分支');
      }

      document.addEventListener('click',e=>{
        const b=e.target.closest('button');if(!b)return;
        if(b.matches('[data-wy-find-back-review]')){document.body.classList.remove('task-setup');state.view='reviewCreate';renderReviewCreate()}
        if(b.matches('[data-wy-intensity]')){wyFindInit().intensity=b.dataset.wyIntensity;renderAll()}
        if(b.matches('[data-wy-db]')){}
        if(b.matches('[data-wy-keyword-refresh]'))toast('已根据研究问题扩展中英文关键词与同义词');
        if(b.matches('[data-wy-find-edit-req]')){
          const box=document.querySelector('#wyFindReqEdit');
          if(box)box.innerHTML='<div style="margin-top:8px;padding:10px;border:1px solid var(--line);border-radius:7px;background:#fff"><div class="search-row"><input class="input" id="wyFindTotal" type="number" min="1" max="80" value="'+state.wyReview.total+'"><span class="muted" style="align-self:center">篇总需求</span></div><div style="display:grid;gap:6px;margin-top:8px">'+state.wyReview.reqs.map((r,i)=>'<div style="display:grid;grid-template-columns:1fr 80px 110px;gap:7px;align-items:center"><span style="font-size:10px">'+r.name+'</span><input class="input" style="height:30px" data-wy-find-req-need="'+i+'" type="number" min="0" value="'+r.need+'"><select class="input" style="height:30px" data-wy-find-req-kind="'+i+'"><option value="must" '+(r.kind==='must'?'selected':'')+'>必须满足</option><option value="prefer" '+(r.kind==='prefer'?'selected':'')+'>优先满足</option></select></div>').join('')+'</div><div class="actions" style="justify-content:flex-end;margin-top:8px"><button class="small-btn primary" data-wy-save-find-req>保存文献需求</button></div></div>';
        }
        if(b.matches('[data-wy-save-find-req]')){
          const n=Number(document.querySelector('#wyFindTotal')?.value)||20;
          state.wyReview.total=Math.max(1,Math.min(80,n));
          document.querySelectorAll('[data-wy-find-req-need]').forEach(x=>{const r=state.wyReview.reqs[Number(x.dataset.wyFindReqNeed)];if(r)r.need=Math.max(0,Math.min(state.wyReview.total,Number(x.value)||0))});
          document.querySelectorAll('[data-wy-find-req-kind]').forEach(x=>{const r=state.wyReview.reqs[Number(x.dataset.wyFindReqKind)];if(r)r.kind=x.value});
          renderAll();toast('已更新检索使用的文献需求');
        }
        if(b.matches('[data-wy-start-search]'))wyStartRunning();
        if(b.matches('[data-wy-find-page]')){wyFindInit().page=Number(b.dataset.wyFindPage);renderAll()}
        if(b.matches('[data-wy-find-prev]')){wyFindInit().page=Math.max(0,wyFindInit().page-1);renderAll()}
        if(b.matches('[data-wy-find-next]')){wyFindInit().page=Math.min(2,wyFindInit().page+1);renderAll()}
        if(b.matches('[data-wy-bulk-oa]')){const f=wyFindInit();f.importedOA=wyOACount();renderAll();toast('正在一键获取 OA 全文：查重 → 入库 → 解析完成')}
        if(b.matches('[data-wy-upload-external]')){wyFindInit().uploadedExternal+=7;renderAll();toast('原型模拟：上传 7 篇已下载全文，已解析并重新计算需求')}
        if(b.matches('[data-wy-export-list]'))wyExportList();
        if(b.matches('[data-wy-import-paper]')){
          const f=wyFindInit(),id=b.dataset.wyImportPaper;
          if(!f.importedPaperIds[id]&&f.importedOA<wyOACount()){f.importedPaperIds[id]=true;f.importedOA=Math.min(wyOACount(),f.importedOA+1);renderAll();toast('全文已一键入库并完成解析')}
        }
        if(b.matches('[data-wy-download-paper]')){wyFindInit().downloadList+=1;toast('已加入下载清单 · 当前 '+wyFindInit().downloadList+' 篇')}
        if(b.matches('[data-wy-rerun-search]')){wyFindInit().stage='running';wyFindInit().runStep=0;wyStartRunning()}
        if(b.matches('[data-wy-agent-prompt]')){wyFindInit().lastAgentUpdate=b.dataset.wyAgentPrompt;wyFindInit().searchRevision++;renderAll();toast('已根据要求更新检索策略')}
        if(b.matches('[data-wy-continue-review]')){
          const s=wyFindStatus();
          if(s==='critical')wyRiskModal();else if(s==='safe')wyContinueReview();
        }
        if(b.matches('[data-wy-risk-more]')){document.querySelector('#modal').classList.remove('open');wyFindInit().page=0;renderAll()}
        if(b.matches('[data-wy-risk-ack]')){document.querySelector('#modal').classList.remove('open');wyContinueReview()}
      },true);

      document.addEventListener('change',e=>{
        if(e.target.matches('[data-wy-db]'))wyFindInit().dbs[e.target.dataset.wyDb]=e.target.checked;
      });

      document.addEventListener('click',e=>{
        const b=e.target.closest('button');
        if(!b||!b.matches('[data-send]'))return;
        const f=wyFindInit();
        if(state.view==='recommend'&&f.stage==='workspace'){
          e.preventDefault();e.stopImmediatePropagation();
          const txt=document.querySelector('#composer')?.value.trim();
          if(txt){
            f.lastAgentUpdate=txt;f.searchRevision++;
            const input=document.querySelector('#composer');if(input)input.value='';
            renderAll();toast('文献助手已更新检索策略');
          }
        }
      },true);

      const wyOldRenderDoc=renderDoc;
      renderDoc=function(){
        wyOldRenderDoc();
        if(state.view==='recommend'){
          document.querySelector('#workBody').innerHTML=renderRecommend();
          document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.view==='library'));
        }
      };
    })();
  `;
  d.body.appendChild(patch);
});
